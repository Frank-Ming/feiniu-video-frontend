name: Build Flutter APK (with fvp native libs)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (Linux · fvp prebuilt so)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter SDK (锁定 3.35.6)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: 装 Android 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang unzip curl

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos || true

      - name: flutter test
        run: flutter test

      # fvp 第一次集成会下载/编译 libmdk + ffmpeg so 库 (10~20 分钟)
      - name: 构建 release APK (单 ABI,arm64)
        run: |
          # 新版 Flutter (3.16+) 用 --split-per-abi 作为 boolean flag,
          # 不接 =false。直接构建单 ABI 减少 fvp 编译时间
          flutter build apk --release \
            --target-platform=android-arm64

      - name: 提取 lib/ 下所有 so 库
        run: |
          mkdir -p artifact
          cd artifact
          unzip -o ../build/app/outputs/flutter-apk/app-release.apk
          echo "=== APK 内全部 so 文件 ==="
          find lib -name "*.so" | sort
          echo "=== so 文件大小 ==="
          du -h lib/*/lib*.so 2>/dev/null | sort

      - name: 把 APK 当 artifact 上传
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            artifact/lib/**/*.so
          if-no-files-found: error
          retention-days: 14

  # 把 lib/ 下的 so 库打包成单独的 zip,方便下载/复用
  build-so-only:
    name: Build fvp prebuilt so libs (zip only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-android
    # 即使 APK 构建成功,so-only job 可以失败而不影响整体 run 的 success 状态
    continue-on-error: false
    if: success()

    steps:
      - name: 下载 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: downloaded

      - name: 打包 so 库
        run: |
          cd downloaded
          # APK artifact 解压后是 build/app/outputs/flutter-apk/app-release.apk
          # 但我们想要的是已经提取好的 lib/ 目录,改用 unzip 重新提取
          if [ ! -d lib ]; then
            unzip -q build/app/outputs/flutter-apk/app-release.apk 'lib/*'
          fi
          echo "=== 提取到的 so 库 ==="
          find lib -name "*.so" | sort
          # 用 cd 进入 lib 父目录,让 zip 里直接是 lib/...
          cd ..
          zip -r fvp-native-libs.zip downloaded/lib/
          ls -lh fvp-native-libs.zip

      - name: 上传 so-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: fvp-native-libs
          path: fvp-native-libs.zip
          retention-days: 30
