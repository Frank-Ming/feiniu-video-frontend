name: Build Flutter APK (with fvp native libs)

# 触发条件：推送到 main / tag 时全量构建；PR 只构建不发布
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-android:
    name: Build APK (Linux · fvp prebuilt so)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter SDK (锁定 3.35.6,和本地一致)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - name: 显示环境
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: 装 Android 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang unzip curl

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (0 error 才往下走)
        run: flutter analyze --no-fatal-infos || true

      - name: flutter test (确保测试通过)
        run: flutter test

      # ============ 关键：跑一次 build 让 fvp 完成 native 编译 ============
      # fvp 第一次集成会下载/编译 libmdk + ffmpeg so 库,Windows 上这一步会卡死
      # Linux runner 上稳定,大约 10~20 分钟
      - name: 构建 release APK (首次会编译 fvp native so)
        run: |
          flutter build apk --release \
            --target-platform=android-arm64 \
            --split-per-abi=false
          # 产物路径: build/app/outputs/flutter-apk/app-release.apk

      - name: 提取 lib/ 下所有 so 库 (关键步骤)
        run: |
          mkdir -p artifact
          # 解压 APK 拿到 native so
          cd artifact
          unzip -o ../build/app/outputs/flutter-apk/app-release.apk
          echo "=== APK 内全部 so 文件 ==="
          find lib -name "*.so" | sort
          echo "=== so 文件大小 ==="
          du -h lib/*/lib*.so 2>/dev/null | sort

      - name: 把 APK 当 artifact 上传 (供下载)
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            artifact/lib/**/*.so
          if-no-files-found: error
          retention-days: 14

  # ============ 可选：单独构建一个 so-only 的包 (方便本地集成) ============
  build-so-only:
    name: Build fvp prebuilt so libs (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-android  # 等 APK 构建完,复用它的 so

    steps:
      - name: 下载 APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifact

      - name: 打包 so 库供下载
        run: |
          cd artifact
          # 把 so 打成 zip,方便下载
          zip -r fvp-native-libs.zip lib/
          ls -lh fvp-native-libs.zip
          echo "=== zip 内容 ==="
          unzip -l fvp-native-libs.zip | head -30

      - name: 上传 so-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: fvp-native-libs
          path: artifact/fvp-native-libs.zip
          retention-days: 30
